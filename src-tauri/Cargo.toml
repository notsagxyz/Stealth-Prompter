[package]
name = "stealthprompter"
version = "0.1.0"
description = "The open-source invisible teleprompter that stays hidden from screen sharing and recordings."
authors = ["Stealth Team"]
edition = "2021"

[lib]
name = "stealthprompter_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "stealth"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0.0", features = ["custom-protocol"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
